name: Test and deploy NEXORA XAU

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-xau-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run source checks
        run: npm run check

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/nexora_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/nexora_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit and verify health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          case "$DEPLOY_SHA" in
            (*[!0-9a-f]*) echo "Invalid commit SHA"; exit 1 ;;
          esac
          ssh -i "$HOME/.ssh/nexora_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH=/opt/nexora-xau
          CONTAINER_NAME=nexora-xau

          test -d "$APP_PATH/.git"
          git -C "$APP_PATH" fetch --prune origin main
          git -C "$APP_PATH" cat-file -e "$DEPLOY_SHA^{commit}"
          git -C "$APP_PATH" reset --hard "$DEPLOY_SHA"
          docker restart "$CONTAINER_NAME"

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18087/healthz | grep -q '"liveness":"ok"'; then
              echo "NEXORA_HEALTHY commit=$DEPLOY_SHA"
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 80 "$CONTAINER_NAME" || true
          echo "NEXORA_HEALTH_CHECK_FAILED commit=$DEPLOY_SHA"
          exit 1
          REMOTE
